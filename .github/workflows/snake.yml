name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#F2A65A&color_dots=#161B22,#262C36,#3D4653,#6B7686,#C9D1D9
            dist/snake-light.svg?color_snake=#C2803A&color_dots=#EBEDF0,#D5D9DE,#B4BAC2,#8B939E,#3D4653

      - name: Push them to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: refresh contribution snake [skip ci]"
